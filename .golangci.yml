version: 2

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - misspell
    - goconst
    - bodyclose
    - contextcheck
    - durationcheck
    - nilerr
    - nolintlint
    - predeclared
    - reassign
    - unconvert
    - unparam
    - wastedassign

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    settings:
      shadow:
        strict: true
    enable-all: true
    disable:
      - fieldalignment # Can be noisy for structs

  revive:
    confidence: 0.8
    rules:
      - name: exported
        arguments: ["checkPrivateReceivers", "sayRepetitiveInsteadOfStutters"]

  gosec:
    excludes:
      - G204 # Subprocess launched with function call as argument - needed for model loading
      - G304 # File path provided as taint input - needed for model file access

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
    disabled-checks:
      - paramTypeCombine # Can be noisy
      - hugeParam # GGUF models require large structs

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 10
  
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - goconst
        - bodyclose
        - errcheck
        - unparam

    # Allow underscore assignments for intentional ignoring of errors in log suppression
    - text: "Error return value.*os\\.OpenFile.*is not checked"
      linters:
        - errcheck
    
    - text: "Error return value.*Close.*is not checked"
      linters:
        - errcheck

    # Exclude model loading related security warnings (needed for offline operation)
    - text: "G204: Subprocess launched with function call"
      linters:
        - gosec
        
    - text: "G306: Expect WriteFile permissions"
      linters:
        - gosec
        
    - text: "G301: Expect directory permissions"
      linters:
        - gosec

    # Allow unused parameters in callback functions and evaluators
    - text: "unused-parameter"
      linters:
        - revive
        
    - text: "`.*` is unused"
      linters:
        - unparam
        - unused

    # Allow some constants to be inline for readability
    - text: "string .* has .* occurrences, make it a constant"
      linters:
        - goconst

    # Allow shadow declarations in error handling patterns
    - text: "declaration of \"err\" shadows"
      linters:
        - govet