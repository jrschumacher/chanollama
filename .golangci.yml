run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gocritic
    - revive
    - gosec
    - goconst
    - bodyclose
    - contextcheck
    - durationcheck
    - exportloopref
    - nilerr
    - nolintlint
    - predeclared
    - reassign
    - unconvert
    - unparam
    - wastedassign

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    check-shadowing: true
    enable-all: true
    disable:
      - fieldalignment # Can be noisy for structs

  revive:
    confidence: 0.8
    rules:
      - name: exported
        arguments: ["checkPrivateReceivers", "sayRepetitiveInsteadOfStutters"]

  gosec:
    excludes:
      - G204 # Subprocess launched with function call as argument - needed for model loading
      - G304 # File path provided as taint input - needed for model file access

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
    disabled-checks:
      - paramTypeCombine # Can be noisy
      - hugeParam # GGUF models require large structs

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - goconst
        - bodyclose

    # Exclude model loading related security warnings (needed for offline operation)
    - text: "G204: Subprocess launched with function call"
      linters:
        - gosec

    # Allow unused parameters in callback functions (common in streaming)
    - text: "unused-parameter"
      linters:
        - revive