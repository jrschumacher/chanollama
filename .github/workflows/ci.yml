name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Validate Project
        uses: jrschumacher/go-actions/self-validate@v1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Run Tests
        uses: jrschumacher/go-actions/ci@v1
        with:
          job: test
          go-version: '1.24'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Run Linting
        uses: jrschumacher/go-actions/ci@v1
        with:
          job: lint
          go-version: '1.24'

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Run Benchmarks
        uses: jrschumacher/go-actions/ci@v1
        with:
          job: benchmark
          go-version: '1.24'

  comment:
    name: Comment
    runs-on: ubuntu-latest
    needs: [test, lint, benchmark]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Comment Results
        uses: jrschumacher/go-actions/ci@v1
        with:
          job: comment