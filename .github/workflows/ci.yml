name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Project
        uses: jrschumacher/go-actions/self-validate@v3

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        uses: jrschumacher/go-actions/ci@v3
        with:
          job: test
          go-version: '1.24'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Run Linting
        uses: jrschumacher/go-actions/ci@v3
        with:
          job: lint
          go-version: '1.24'
