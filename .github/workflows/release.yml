name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_SECRET }}

      - name: Release
        uses: jrschumacher/go-actions/release@v3
        with:
          release-token: ${{ secrets.RELEASE_PLEASE_SECRET }}
          create-version-aliases: false
          go-version: '1.24'
